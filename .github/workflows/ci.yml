name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias e integración
        run: npm test

      - name: Validar contrato OpenAPI (esquema)
        run: npm run validate:openapi

      - name: Lint del contrato OpenAPI (Spectral)
        run: npm run lint:openapi

  postman-contract-gate:
    name: Gate de contrato (Postman/Newman)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar Core en background (DEV)
        run: node src/server.js &

      - name: Esperar a que /health responda
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Core listo"
              exit 0
            fi
            sleep 1
          done
          echo "::error::El Core no respondió a /health a tiempo"
          exit 1

      # Acotado a "Ally Registration": es el único folder implementado (US-02.1.1-M2).
      # login/refresh/logout (folder "Auth") siguen sin implementar y seguirían dando
      # 404 — se vuelven a incluir en el gate cuando tengan su propia tarea de
      # implementación. Ver docs/openapi/core.yaml y postman/MANI-Core.postman_collection.json.
      - name: Ejecutar colección Postman con Newman contra DEV
        run: >
          npm run postman:run:dev --
          --folder "Ally Registration"
          --reporters cli,junit
          --reporter-junit-export newman/report.xml

      - name: Publicar reporte de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/report.xml
          retention-days: 14
