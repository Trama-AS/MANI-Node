name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias e integración
        run: npm test
