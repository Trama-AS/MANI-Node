# =====================================================================
# Configuración de SonarQube / SonarCloud para MANI-Node (Core Service)
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube), CFG-41 (SCRUM-1116)
# Plantilla: sonar-project.properties de MANI-Flutter
# =====================================================================

# Identificación del proyecto (confirmar clave y organización con DevOps)
sonar.projectKey=Trama-AS_MANI-Node
sonar.organization=trama-as
sonar.projectName=MANI-Node

sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Reporte de cobertura generado por "npm run test:coverage" (Node 22, lcov nativo)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de análisis estático
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  .github/**
