# =====================================================================
# Configuración de SonarQube para MANI-Node (Core Service)
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube), CFG-41 (SCRUM-1116),
# QA4-02 (SCRUM-1265)
# Servidor: SonarQube Community de la VM de Calidad (self-hosted, no SonarCloud)
# =====================================================================

# Identificación del proyecto. En pull requests el workflow quality-gate.yml
# sobrescribe la clave con mani-node-pr (Community no analiza ramas ni PRs).
sonar.projectKey=mani-node
sonar.projectName=MANI-Node

sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Reporte de cobertura generado por "npm run test:coverage" (Node 22, lcov nativo)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de análisis estático
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  .github/**
